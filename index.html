<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemeinsam den Meister meistern</title>
  </head>
  <body class="bg-neutral-100">
    <header data-component="header"></header>
    <main>
      <section class="mx-auto max-w-6xl px-6 py-8 lg:py-24">
        <div class="grid grid-cols-12 items-center gap-8 lg:gap-12">
          <div class="col-span-12 lg:col-span-6 lg:order-2">
            <div class="overflow-hidden rounded-2xl border-8 border-primary">
              <img src="/images/home-hero.jpg" alt="NTG-Lerngruppe beim gemeinsamen Lernen" class="h-full w-full object-cover" />
            </div>
          </div>

          <div class="relative col-span-12 lg:col-span-6 lg:order-1">
            <img src="/images/illustrations/star.svg" alt="" class="absolute top-0 right-0 lg:-top-8 h-auto w-12 lg:w-14" />

            <h1 class="font-poppins text-h1 text-neutral-900">
              NTG gemeinsam begreifen statt allein bangen.
            </h1>

            <h4 class="mt-4 font-inter text-h4 text-neutral-900">
              NTG-Prüfungsvorbereitung. In kleiner Lerngruppe mit maximaler Unterstützung.
            </h4>

            <a href="#" class="mt-6 inline-flex items-center gap-2 rounded-2xl bg-secondary-light px-6 py-3 font-inter text-body-2 font-medium text-neutral-900 transition-colors duration-150 hover:bg-secondary-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900">
              Mehr erfahren
              <img src="/icons/ArrowRight.svg" alt="" class="size-4" />
            </a>
          </div>
        </div>
      </section>
    </main>
    <footer data-component="footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
