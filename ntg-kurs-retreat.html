<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTG-Prüfungsvorbereitung für Industriemeister Metall und Elektrotechnik | Onlinekurs und Retreat</title>
    <meta name="description" content="NTG Kurs mit einwöchigem Retreat für Industriemeister Metall und Elektrotechnik. Gemeinsam lernen, sicher in die IHK-Prüfung starten." />
  </head>
  <body class="bg-neutral-100">
    <header data-component="header"></header>
    <main>
<section class="mx-auto max-w-6xl px-6 py-12 md:flex md:h-[calc(100vh-var(--header-height))] md:items-center md:overflow-hidden md:py-20 lg:py-32">
        <div class="grid w-full grid-cols-1 gap-8 md:grid-cols-2 md:gap-12">
          <div class="md:order-2 md:h-full">
            <div class="overflow-hidden rounded-[32px] border-[6px] border-primary bg-neutral-100 p-7 md:h-full md:w-full md:border-[8px]">
              <img src="/images/retreat-hero.jpg" alt="Mehrere Schüler schauen sich gemeinsam etwas auf dem Laptop an. Dabei wird gelacht. Sie lernen gemeinsam für die NTG Prüfung." class="h-auto w-full rounded-[4px] md:h-full md:w-full md:object-cover" />
            </div>
          </div>

          <div class="md:order-1 md:flex md:h-full md:flex-col md:justify-center">
            <div class="relative">
              <h1 class="font-poppins text-h1 text-neutral-900">
                NTG Kurs mit Retreat. Lerne und wachse als Gruppe.
              </h1>

              <h4 class="mt-4 font-inter text-h4 text-neutral-900">
                Wir starten mit einem 12 wöchigen Kurs, dann geht es gemeinsam eine Woche ins intensiv Retreat.
              <a href="#" class="mt-6 inline-flex items-center gap-2 rounded-2xl bg-secondary-light px-6 py-3 font-inter text-body-2 font-medium text-neutral-900 transition-colors duration-150 hover:bg-secondary-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900">
                Kursinfo runterladen
                <img src="/icons/DownloadSimple.svg" alt="" class="size-4" />
              </a>
            </div>
          </div>
        </div>
      </section>

      <section data-component="kurstermine" data-seite="retreat"></section>
<section data-component="faq" data-seite="retreat"></section>
    </main>
    <footer data-component="footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
